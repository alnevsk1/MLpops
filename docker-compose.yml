version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mlhub_db
    environment:
      # Задаем параметры для инициализации БД
      POSTGRES_DB: mlhub_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mlhub_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: mlhub_backend
    env_file:
      - ./backend/.env
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend/media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: mlhub_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pg_data: